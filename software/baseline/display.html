<!DOCTYPE html>
<html>
<head>
    <title>MDR Terminal</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --main-bg-color: #000000;
            --main-text-color: #00c3b5; /* Teal color from Severance */
            --secondary-text: #80DED5;
            --dark-text: #00635b;
            --headers-color: #ffffff;
            --element-bg-color: #121212;
            --terminal-glow: 0 0 4px rgba(0, 195, 181, 0.3);
            --section-border: 1px solid #00635b;
            
            /* Warning color scheme (yellow) */
            --warning-text-color: #c3b400;
            --warning-secondary-text: #d4c953;
            --warning-dark-text: #635600;
            --warning-terminal-glow: 0 0 4px rgba(195, 180, 0, 0.3);
            --warning-section-border: 1px solid #635600;
            
            /* Danger color scheme (amber) */
            --danger-text-color: #c35400;
            --danger-secondary-text: #d47e3a;
            --danger-dark-text: #633500;
            --danger-terminal-glow: 0 0 4px rgba(195, 84, 0, 0.3);
            --danger-section-border: 1px solid #633500;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            background-color: var(--main-bg-color);
            color: var(--main-text-color);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 16px;
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            animation: bootSequence 1.5s ease-in-out;
            position: relative;
        }

        /* SIGNIFICANTLY ENHANCED CRT scan lines effect */
        .crt-scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                to bottom,
                rgba(0, 0, 0, 0.4),
                rgba(0, 0, 0, 0.4) 2px,
                transparent 2px,
                transparent 4px
            );
            z-index: 999;
            pointer-events: none;
            opacity: 1;
        }

        /* Secondary scan effect with teal tint */
        .crt-scanlines-secondary {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                to bottom,
                rgba(0, 195, 181, 0.03),
                rgba(0, 195, 181, 0.03) 1px,
                transparent 1px,
                transparent 8px
            );
            z-index: 998;
            pointer-events: none;
            opacity: 1;
            mix-blend-mode: screen;
        }

        /* CRT screen edge darkening effect */
        .crt-frame {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(
                ellipse at center,
                transparent 50%,
                rgba(0, 0, 0, 0.3) 100%
            );
            z-index: 997;
            pointer-events: none;
        }

        /* Occasional horizontal displacement */
        .crt-displacement {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 996;
            pointer-events: none;
            animation: horizontalDisplacement 15s infinite;
            opacity: 0;
        }

        /* Subtle CRT flicker effect */
        .crt-flicker {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 995;
            pointer-events: none;
            animation: flicker 15s infinite;
            opacity: 0;
            background: var(--main-text-color);
        }

        @keyframes bootSequence {
            0% { opacity: 0; }
            5% { opacity: 0.3; }
            7% { opacity: 0; }
            10% { opacity: 0.7; }
            12% { opacity: 0.3; }
            15% { opacity: 1; }
            100% { opacity: 1; }
        }

        @keyframes flicker {
            0%, 95%, 100% { opacity: 0; }
            97%, 97.5% { opacity: 0.01; }
        }

        @keyframes horizontalDisplacement {
            0%, 98%, 100% { 
                opacity: 0;
                transform: translateX(0);
            }
            98.1%, 98.3% { 
                opacity: 0.2;
                transform: translateX(5px);
            }
            98.4%, 98.6% { 
                opacity: 0.2;
                transform: translateX(-5px);
            }
            98.7%, 98.9% { 
                opacity: 0.2;
                transform: translateX(2px);
            }
        }

        /* Horizontal band that occasionally sweeps down the screen */
        .crt-refresh-band {
            position: fixed;
            top: -100px;
            left: 0;
            width: 100%;
            height: 10px;
            background: linear-gradient(
                to bottom,
                rgba(255, 255, 255, 0) 0%,
                rgba(0, 195, 181, 0.1) 50%,
                rgba(255, 255, 255, 0) 100%
            );
            z-index: 994;
            pointer-events: none;
            animation: sweepDown 15s infinite;
            opacity: 0;
        }

        @keyframes sweepDown {
            0%, 30%, 100% { 
                opacity: 0;
                top: -100px;
            }
            32%, 38% { 
                opacity: 1;
                top: 100vh;
            }
        }

        .main-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 24px 24px 0 24px; /* Remove bottom padding */
            gap: 24px;
            position: relative;
            z-index: 1;
        }

        .header {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            background: var(--element-bg-color);
            border: var(--section-border);
            box-shadow: var(--terminal-glow);
        }

        .header h1 {
            margin: 0;
            font-size: 1.6em;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 500;
            color: var(--headers-color);
        }

        .lumon-logo {
            font-size: 0.5em;
            color: var(--dark-text);
            letter-spacing: 1px;
            margin-left: 15px;
        }

        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 24px;
            overflow: hidden;
        }

        .task-display {
            flex: 1;
            background: var(--element-bg-color);
            border: var(--section-border);
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            box-shadow: var(--terminal-glow);
            position: relative;
        }

        .loading {
            display: none;
            height: 100%;
            background: var(--element-bg-color);
            border: var(--section-border);
            box-shadow: var(--terminal-glow);
            position: relative;
            padding: 24px;
        }

        .loading-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .loading-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid var(--dark-text);
            border-radius: 50%;
            border-top-color: var(--main-text-color);
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .buttons-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }

        button {
            padding: 14px 0;
            font-size: 1.1em;
            border: var(--section-border);
            background: var(--element-bg-color);
            color: var(--main-text-color);
            font-family: 'IBM Plex Mono', monospace;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: var(--terminal-glow);
            position: relative;
            overflow: hidden;
        }

        button:hover {
            box-shadow: 0 0 8px rgba(0, 195, 181, 0.5);
        }

        button:active {
            transform: scale(0.98);
        }

        /* Growing highlight effect when button is clicked */
        button::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 5px;
            height: 5px;
            background: rgba(0, 195, 181, 0.5);
            opacity: 0;
            border-radius: 100%;
            transform: scale(1, 1) translate(-50%, -50%);
            transform-origin: 50% 50%;
        }

        button:active::after {
            animation: ripple 0.6s ease-out;
        }

        @keyframes ripple {
            0% {
                transform: scale(0, 0) translate(-50%, -50%);
                opacity: 0.5;
            }
            100% {
                transform: scale(20, 20) translate(-50%, -50%);
                opacity: 0;
            }
        }

        /* Task header with title and timer side by side */
        .task-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--dark-text);
            padding-bottom: 12px;
            gap: 20px;
        }

        .task-title {
            font-size: 1.5em;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 500;
            color: var(--headers-color);
            flex: 1;
        }

        .task-description {
            font-size: 0.8em;
            line-height: 1.6;
            color: var(--secondary-text);
            flex-grow: 1;
            margin-bottom: 24px;
        }

        .terminal-cursor {
            display: flex;
            align-items: center;
        }

        .prompt {
            color: var(--dark-text);
            margin-right: 8px;
        }

        .blinking-cursor {
            display: inline-block;
            width: 10px;
            height: 18px;
            background: var(--main-text-color);
            animation: cursor-blink 1s infinite;
        }

        @keyframes cursor-blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        .status-bar {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            background: var(--element-bg-color);
            color: var(--dark-text);
            padding: 10px 15px;
            border: var(--section-border);
            border-bottom: none; /* Remove bottom border */
            box-shadow: var(--terminal-glow);
            font-size: 0.9em;
            margin-top: auto; /* Push to bottom of flex container */
        }

        .status-bar div:nth-child(2) {
            text-align: center;
        }

        .status-bar div:nth-child(3) {
            text-align: right;
        }

        .keyboard-shortcut {
            display: inline-block;
            color: var(--dark-text);
            margin-right: 6px;
            font-size: 0.9em;
        }
        
        /* Timer styles */
        .task-timer {
            display: none;
            background-color: rgba(0,0,0,0.2);
            padding: 10px;
            border: var(--section-border);
            margin-left: 15px;
        }
        
        .timer-display {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        
        .timer-circle {
            position: relative;
            width: 80px;
            height: 80px;
        }
        
        .analog-timer {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-color: rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .timer-progress {
            position: absolute;
            top: 0;
            left: 0;
            width: 50%;
            height: 100%;
            transform-origin: right center;
            background-color: var(--main-text-color);
        }
        
        .timer-progress.right {
            left: 50%;
            transform-origin: left center;
        }
        
        .timer-mask {
            position: absolute;
            width: 70%;
            height: 70%;
            top: 15%;
            left: 15%;
            border-radius: 50%;
            background-color: rgba(0,0,0,0.5);
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.8em;
            color: var(--main-text-color);
        }
        
        .timer-digital {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .timer-row {
            display: flex;
            align-items: center;
        }
        
        .timer-label {
            width: 50px;
            text-align: right;
            margin-right: 10px;
            font-size: 0.9em;
            color: var(--dark-text);
        }
        
        .timer-value {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 1.1em;
        }
        
        .challenge-time .timer-value {
            color: var(--secondary-text);
        }
        
        /* Timer states */
        body.time-warning {
            /* Yellow color scheme */
            --main-text-color: var(--warning-text-color);
            --secondary-text: var(--warning-secondary-text);
            --dark-text: var(--warning-dark-text);
            --terminal-glow: var(--warning-terminal-glow);
            --section-border: var(--warning-section-border);
        }
        
        body.time-danger {
            /* Amber color scheme */
            --main-text-color: var(--danger-text-color);
            --secondary-text: var(--danger-secondary-text);
            --dark-text: var(--danger-dark-text);
            --terminal-glow: var(--danger-terminal-glow);
            --section-border: var(--danger-section-border);
        }
    </style>
</head>
<body>
    <!-- Enhanced CRT effects with more pronounced scan lines -->
    <div class="crt-scanlines"></div>
    <div class="crt-scanlines-secondary"></div>
    <div class="crt-frame"></div>
    <div class="crt-displacement"></div>
    <div class="crt-flicker"></div>
    <div class="crt-refresh-band"></div>

    <div class="main-container">
        <div class="header">
            <h1>Macrodata Refinement <span class="lumon-logo">LUMON INDUSTRIES</span></h1>
        </div>
        
        <div class="content-area">
            <div class="task-display" id="taskDisplay">
                <div class="task-title">Welcome, Refiner</div>
                <div class="task-description">The work is mysterious and important. Please select "New Task" to begin your work session. Remember, data must be refined by those who are separated.</div>
                <div class="terminal-cursor">
                    <span class="prompt">mdr$</span>
                    <span class="blinking-cursor"></span>
                </div>
            </div>
            
            <div class="loading" id="loading">
                <div class="loading-content">
                    <div class="loading-spinner"></div>
                    <div>Requesting data from Mainframe</div>
                </div>
            </div>
        </div>

        <div class="buttons-container">
            <button id="newTaskBtn"><span class="keyboard-shortcut">[N]</span>New Task</button>
            <button id="yesBtn"><span class="keyboard-shortcut">[Y]</span>Complete</button>
            <button id="noBtn"><span class="keyboard-shortcut">[X]</span>Skip</button>
        </div>
        
        <div class="status-bar">
            <div id="terminalId">Terminal: MDR-775</div>
            <div id="dateTime">0000-00-00 00:00:00</div>
            <div id="systemStatus">Status: Active</div>
        </div>
    </div>

    <script>
        let currentTask = null;
        let timerInterval = null;
        let startTime = null;
        let estimatedTimeInMinutes = 0;
        let challengeTimeInMinutes = 0;
        
        // Initialize with boot sequence
        function simulateBootSequence() {
            const display = document.getElementById('taskDisplay');
            const originalContent = display.innerHTML;
            
            display.innerHTML = '<div class="task-description" style="margin-top: 80px; text-align: center;">Initializing Lumon Terminal...</div>';
            
            setTimeout(() => {
                display.innerHTML = '<div class="task-description" style="margin-top: 80px; text-align: center;">Loading Macrodata Refinement Protocols...</div>';
                
                setTimeout(() => {
                    display.innerHTML = '<div class="task-description" style="margin-top: 80px; text-align: center;">Establishing Connection...</div>';
                    
                    setTimeout(() => {
                        display.innerHTML = '<div class="task-description" style="margin-top: 80px; text-align: center;">Terminal Ready.</div>';
                        
                        setTimeout(() => {
                            display.innerHTML = originalContent;
                        }, 700);
                    }, 700);
                }, 700);
            }, 700);
        }

        // Simulate occasional CRT malfunction
        function simulateCrtMalfunction() {
            // Random timing for the effect
            const interval = Math.floor(Math.random() * 30000) + 20000; // Between 20-50 seconds
            
            setTimeout(() => {
                // Create a brief visual glitch
                const glitch = document.createElement('div');
                glitch.style.position = 'fixed';
                glitch.style.top = '0';
                glitch.style.left = '0';
                glitch.style.width = '100%';
                glitch.style.height = '100%';
                glitch.style.backgroundColor = 'rgba(0, 195, 181, 0.05)';
                glitch.style.zIndex = '1000';
                glitch.style.pointerEvents = 'none';
                document.body.appendChild(glitch);
                
                // Random vertical offset
                const randomOffset = Math.floor(Math.random() * 20) - 10;
                document.body.style.transform = `translateY(${randomOffset}px)`;
                
                // Remove the effect after a short time
                setTimeout(() => {
                    document.body.removeChild(glitch);
                    document.body.style.transform = '';
                    
                    // Set up the next malfunction
                    simulateCrtMalfunction();
                }, 200);
            }, interval);
        }

        async function getNewTask() {
            document.getElementById('taskDisplay').style.display = 'none';
            document.getElementById('loading').style.display = 'flex';
            
            // Stop any existing timer
            stopTaskTimer();
            
            try {
                const response = await fetch('/print_task', {
                    method: 'POST'
                });
                const data = await response.json();
                
                // Simulated delay for terminal effect
                setTimeout(() => {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('taskDisplay').style.display = 'flex';
                    
                    if (data.success) {
                        currentTask = data.task;
                        displayTaskWithTypingEffect(data.task);
                    } else {
                        displayError("No tasks available in queue");
                    }
                }, 1500);
                
            } catch (error) {
                setTimeout(() => {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('taskDisplay').style.display = 'flex';
                    displayError("Connection error: Unable to reach mainframe");
                }, 1500);
            }
        }

        function displayTaskWithTypingEffect(task) {
            const display = document.getElementById('taskDisplay');
            display.innerHTML = '';
            
            const titleText = task.ticket_title || task.title || "Untitled Task";
            
            // Create task header (will contain title and timer side by side)
            const headerContainer = document.createElement('div');
            headerContainer.className = 'task-header';
            display.appendChild(headerContainer);
            
            // Create title element
            const titleElement = document.createElement('div');
            titleElement.className = 'task-title';
            headerContainer.appendChild(titleElement);
            
            // Create timer element
            const timerElement = document.createElement('div');
            timerElement.className = 'task-timer';
            timerElement.id = 'taskTimer';
            timerElement.innerHTML = `
                <div class="timer-display">
                    <div class="timer-circle">
                        <div class="analog-timer">
                            <div class="timer-progress left" id="progressLeft"></div>
                            <div class="timer-progress right" id="progressRight"></div>
                            <div class="timer-mask">
                                <span id="percentComplete">0%</span>
                            </div>
                        </div>
                    </div>
                    <div class="timer-digital">
                        <div class="timer-row estimated-time">
                            <span class="timer-label">EST:</span>
                            <span class="timer-value" id="estimatedTimeDisplay">--:--</span>
                        </div>
                        <div class="timer-row challenge-time">
                            <span class="timer-label">CHG:</span>
                            <span class="timer-value" id="challengeTimeDisplay">--:--</span>
                        </div>
                    </div>
                </div>
            `;
            
            // Add timer to header container
            headerContainer.appendChild(timerElement);
            
            const cursorLine = document.createElement('div');
            cursorLine.className = 'terminal-cursor';
            cursorLine.innerHTML = '<span class="prompt">mdr$</span><span class="blinking-cursor"></span>';
            
            // Type title with a typing effect
            let titleIndex = 0;
            let titleInterval = setInterval(() => {
                if (titleIndex < titleText.length) {
                    titleElement.textContent += titleText.charAt(titleIndex);
                    titleIndex++;
                } else {
                    clearInterval(titleInterval);
                    
                    // Check if this is a timed task (active task)
                    if (task.estimated_time) {
                        // For active tasks, show timer
                        timerElement.style.display = 'flex';
                        display.appendChild(cursorLine);
                        startTaskTimer(task);
                    } else {
                        // For non-timed tasks or completion messages, show description
                        const descElement = document.createElement('div');
                        descElement.className = 'task-description';
                        display.appendChild(descElement);
                        
                        const descText = task.motivation || task.description || "No description provided.";
                        let descIndex = 0;
                        let descInterval = setInterval(() => {
                            if (descIndex < descText.length) {
                                descElement.textContent += descText.charAt(descIndex);
                                descIndex++;
                            } else {
                                clearInterval(descInterval);
                                display.appendChild(cursorLine);
                            }
                        }, 15);
                    }
                }
            }, 35);
        }

        function displayError(message) {
            const display = document.getElementById('taskDisplay');
            display.innerHTML = `
                <div class="task-title">System Notice</div>
                <div class="task-description">${message}</div>
                <div class="terminal-cursor">
                    <span class="prompt">mdr$</span>
                    <span class="blinking-cursor"></span>
                </div>
            `;
        }

        function updateDateTime() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            document.getElementById('dateTime').textContent = 
                `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
        }
        
        // Timer functions
        function startTaskTimer(task) {
            // Reset UI
            document.body.classList.remove('time-warning', 'time-danger');
            
            // Parse time values
            estimatedTimeInMinutes = parseInt(task.estimated_time || "15");
            challengeTimeInMinutes = parseInt(task.challenge_time || "0");
            
            if (estimatedTimeInMinutes <= 0) {
                estimatedTimeInMinutes = 15; // Default fallback
            }
            
            // Set start time
            startTime = new Date();
            
            // Show timer
            const timerEl = document.getElementById('taskTimer');
            timerEl.style.display = 'flex';
            
            // Clear existing interval if any
            if (timerInterval) {
                clearInterval(timerInterval);
            }
            
            // Update immediately and start interval
            updateTimer();
            timerInterval = setInterval(updateTimer, 1000);
        }
        
        function stopTaskTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            
            // Reset UI
            document.body.classList.remove('time-warning', 'time-danger');
            
            // Hide timer
            const timerEl = document.getElementById('taskTimer');
            if (timerEl) {
                timerEl.style.display = 'none';
            }
        }
        
        function updateTimer() {
            if (!startTime) return;
            
            const now = new Date();
            const elapsedMs = now - startTime;
            const elapsedMinutes = elapsedMs / 60000;
            
            // Calculate remaining times
            const estimatedRemaining = Math.max(0, estimatedTimeInMinutes - elapsedMinutes);
            const challengeRemaining = challengeTimeInMinutes > 0 
                ? Math.max(0, challengeTimeInMinutes - elapsedMinutes) 
                : 0;
            
            // Calculate percentage for visual display
            const percentComplete = Math.min(100, Math.floor((elapsedMinutes / estimatedTimeInMinutes) * 100));
            
            // Update digital display
            document.getElementById('estimatedTimeDisplay').textContent = formatTimeDisplay(estimatedRemaining);
            document.getElementById('percentComplete').textContent = `${percentComplete}%`;
            
            if (challengeTimeInMinutes > 0) {
                document.getElementById('challengeTimeDisplay').textContent = formatTimeDisplay(challengeRemaining);
            } else {
                document.getElementById('challengeTimeDisplay').textContent = "--:--";
            }
            
            // Update analog display
            updateAnalogDisplay(percentComplete);
            
            // Update color scheme based on timer state
            if (challengeTimeInMinutes > 0 && challengeRemaining <= 0) {
                // Past challenge time - amber
                document.body.classList.remove('time-warning');
                document.body.classList.add('time-danger');
            } else if (estimatedRemaining <= 0) {
                // Past estimated time - yellow
                document.body.classList.remove('time-danger');
                document.body.classList.add('time-warning');
            } else {
                // Normal time - teal
                document.body.classList.remove('time-warning', 'time-danger');
            }
        }
        
        function formatTimeDisplay(minutes) {
            const mins = Math.floor(minutes);
            const secs = Math.floor((minutes - mins) * 60);
            return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }
        
        function updateAnalogDisplay(percent) {
            // Analog display uses a half-circle progress on each side
            // For 0-50% we rotate the left side only
            // For 51-100% the left side is full and we rotate the right side
            
            const leftEl = document.getElementById('progressLeft');
            const rightEl = document.getElementById('progressRight');
            
            if (percent <= 50) {
                // Only adjust left side (0 to 180 degrees)
                const degrees = (percent / 50) * 180;
                leftEl.style.transform = `rotate(${degrees}deg)`;
                rightEl.style.transform = 'rotate(0deg)';
            } else {
                // Left side is complete, adjust right side
                leftEl.style.transform = 'rotate(180deg)';
                const degrees = ((percent - 50) / 50) * 180;
                rightEl.style.transform = `rotate(${degrees}deg)`;
            }
        }

        // Event listeners for buttons
        document.getElementById('newTaskBtn').addEventListener('click', () => {
            getNewTask();
        });
        
        document.getElementById('yesBtn').addEventListener('click', async () => {
            if (!currentTask) return;
            
            // Stop timer
            stopTaskTimer();
            
            try {
                // Call the API to complete the task
                const response = await fetch('/complete_task', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        task_id: currentTask.task_id,
                        source_list: currentTask.source_list
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    displayTaskWithTypingEffect({
                        title: "Task Completed",
                        description: "Your refinement has been recorded and task moved to DONE. Please continue with your important work."
                    });
                } else {
                    displayTaskWithTypingEffect({
                        title: "System Notice",
                        description: `Failed to complete task: ${result.message}`
                    });
                }
            } catch (error) {
                console.error("Error completing task:", error);
                displayTaskWithTypingEffect({
                    title: "Connection Error",
                    description: "Unable to communicate with mainframe. The task may not have been marked as complete."
                });
            }
            
            currentTask = null;
        });

        document.getElementById('noBtn').addEventListener('click', async () => {
            if (!currentTask) return;
            
            // Stop timer
            stopTaskTimer();
            
            try {
                // Call the API to skip the task
                const response = await fetch('/skip_task', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        task_id: currentTask.task_id
                    })
                });
                
                const result = await response.json();
                
                displayTaskWithTypingEffect({
                    title: "Task Skipped",
                    description: "This data will be reassigned. Remember that all data must be refined."
                });
            } catch (error) {
                console.error("Error skipping task:", error);
                displayTaskWithTypingEffect({
                    title: "Connection Error",
                    description: "Unable to communicate with mainframe."
                });
            }
            
            currentTask = null;
        });

        // Add keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'n' || e.key === 'N') {
                document.getElementById('newTaskBtn').click();
            } else if (e.key === 'y' || e.key === 'Y') {
                document.getElementById('yesBtn').click();
            } else if (e.key === 'x' || e.key === 'X') {
                document.getElementById('noBtn').click();
            }
        });

        // Initialize the terminal
        window.addEventListener('load', () => {
            simulateBootSequence();
            simulateCrtMalfunction();
            setInterval(updateDateTime, 1000);
            updateDateTime();
        });
    </script>
</body>
</html>
