<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lumon · Macrodata Refinement</title>
  <link rel="stylesheet" href="/static/terminal.css?v=4">
  <link rel="stylesheet" href="/static/terminal-shared.css?v=8">
  <script defer src="/static/terminal.js?v=8"></script>
</head>
<body>
  <main class="terminal">
    <header class="masthead">
      <a class="theme-link" href="/display?theme=mdr" aria-label="Switch terminal layout" title="Switch terminal layout"><img class="logo" src="/static/lumon.svg" alt="Lumon Industries" width="108" height="60"></a>
      <div class="station">
        <h1>Macrodata Refinement</h1>
        <p>STATION 775</p>
      </div>
    </header>
    <section class="workspace" aria-label="Current assignment">
      <div class="assignment" id="taskDisplay" aria-live="polite">
        <h2 id="taskTitle">Welcome, Refiner</h2>
        <p id="taskDescription">The work is mysterious and important.<br>Select New Task for an assignment, or Manage to choose one.</p>
      </div>
      <section class="task-picker" id="taskPicker" hidden aria-label="Choose a task">
        <div class="picker-heading"><h2 id="pickerHeading">Choose your assignment</h2><div class="picker-summary"><span id="pickerPage" aria-live="polite"></span><span id="pickerTotal" hidden></span></div></div>
        <p id="pickerNotice" role="status" hidden></p>
        <div class="task-grid" id="taskGrid"></div>
      </section>
      <div class="refinement-field" id="numberField" hidden aria-hidden="true"><canvas id="numberCanvas"></canvas></div>
      <div class="workspace-bottom">
        <div class="terminal-prompt">mdr&gt;<span class="cursor" aria-hidden="true"></span></div>
      </div>
    </section>
    <nav class="actions" aria-label="Task actions">
      <button id="newTaskBtn">[N] NEW TASK</button>
      <button id="manageBtn" class="wide-action">[M] MANAGE</button>
      <button id="yesBtn" disabled hidden>[C] COMPLETE</button>
      <button id="noBtn" disabled hidden>[S] SKIP</button>
    </nav>
    <nav class="actions picker-actions" id="pickerActions" hidden aria-label="Browse tasks">
      <button id="pickerBack">BACK</button>
      <button id="pickerPrevious">PREVIOUS</button>
      <button id="pickerNext">NEXT</button>
      <button id="pickerRetry" class="wide-action" hidden>RETRY</button>
      <button id="pickerStart" class="wide-action" hidden>START &amp; PRINT</button>
    </nav>
    <footer class="status-bar">
      <span>TERMINAL: MDR-775</span>
      <time id="dateTime"></time>
      <span class="connection" id="connectionState" role="status">STATUS: CHECKING</span>
    </footer>
  </main>
</body>
</html>
